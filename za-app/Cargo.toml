[package]
name = "za-app"
version = "0.1.0"
edition = "2021"
authors = ["versonr7"]
description = "ZAVOGLES-GUI - Zero Allocation Vulkan OpenGL ES GUI"
license = "GPL-3.0-only"

[lib]
name = "za_app"
crate-type = ["cdylib"]

[dependencies]
za-math = { path = "../za-math" }
za-sys = { path = "../za-sys" }
za-gles = { path = "../za-gles" }
za-xmb = { path = "../za-xmb" }
heapless = "0.9.3"
libm = "0.2.16"
libc = "0.2"

[package.metadata.android]
package = "com.versonr7.zavogles"
build_targets = ["aarch64-linux-android"]
java_sources = "java"  # ← ADD THIS! Points to za-app/java/

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
label = "ZAVOGLES-GUI"
debuggable = true

[[package.metadata.android.application.activity]]
name = "com.versonr7.zavogles.ZavoglesActivity"
label = "ZAVOGLES-GUI"
exported = true

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
