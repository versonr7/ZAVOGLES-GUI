<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZAVOGLES-GUI - XMB with Atari</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }

    /* الخلفية والموجة */
    .bg { position: absolute; inset: 0; background: linear-gradient(180deg, #050810 0%, #0a1020 50%, #050810 100%); }
    .wave { position: absolute; left: 0; right: 0; top: 30%; height: 25%; background: linear-gradient(180deg, transparent, rgba(30, 60, 120, 0.3), transparent); animation: waveMove 4s ease-in-out infinite; }
    @keyframes waveMove { 0%,100% { transform: translateY(0) scaleY(1); opacity: 0.8; } 50% { transform: translateY(-10px) scaleY(1.1); opacity: 1; } }

    /* شريط XMB */
    .xmb-bar { position: absolute; left: 0; right: 0; top: 55%; display: flex; justify-content: center; align-items: center; gap: 6vw; transform: translateY(-50%); z-index: 10; }
    .cat { width: 15vw; height: 9vh; min-width: 90px; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(10px, 2vw, 16px); font-weight: 600; color: rgba(255,255,255,0.6); background: rgba(20, 50, 100, 0.4); border: 1px solid rgba(60, 140, 255, 0.2); border-radius: 8px; transition: all 0.3s ease; cursor: pointer; }
    .cat.selected { background: rgba(60, 140, 255, 0.9); color: #fff; border-color: rgba(100, 180, 255, 0.8); box-shadow: 0 0 20px rgba(60, 140, 255, 0.5); transform: scale(1.1); }
    .cat svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }

    /* أزرار التحكم */
    .controller-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
    .btn-group { position: absolute; pointer-events: auto; }

    /* D-Pad (يسار) */
    .dpad { left: 4vw; top: 50%; transform: translateY(-50%); width: 18vw; height: 18vw; max-width: 130px; max-height: 130px; position: relative; }
    .dpad-btn { position: absolute; width: 33.3%; height: 33.3%; border: 2px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.3); }
    .dpad-up    { top: 0; left: 33.3%; border-bottom: none; }
    .dpad-down  { bottom: 0; left: 33.3%; border-top: none; }
    .dpad-left  { left: 0; top: 33.3%; border-right: none; }
    .dpad-right { right: 0; top: 33.3%; border-left: none; }
    .dpad-center { top: 33.3%; left: 33.3%; width: 33.4%; height: 33.4%; background: transparent; border: none; }

    /* أزرار PS3 (يمين) - شبكة 3x3 */
    .ps3-actions { right: 4vw; top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 1vw; width: 20vw; max-width: 150px; aspect-ratio: 1; }
    .ps-btn { border-radius: 50%; border: 2px solid rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.8); font-weight: bold; font-size: clamp(14px, 2.5vw, 24px); background: rgba(0,0,0,0.3); }
    .btn-triangle { grid-column: 2; grid-row: 1; }
    .btn-circle   { grid-column: 3; grid-row: 2; }
    .btn-cross    { grid-column: 2; grid-row: 3; }
    .btn-square   { grid-column: 1; grid-row: 2; }

    /* أزرار الكتف L/R */
    .shoulder-btn { position: absolute; top: 4vh; width: 12vw; height: 5vh; max-width: 100px; max-height: 45px; border: 2px solid rgba(255,255,255,0.7); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.8); font-weight: bold; background: rgba(0,0,0,0.3); pointer-events: auto; }
    .shoulder-btn.left  { left: 4vw; }
    .shoulder-btn.right { right: 4vw; }

    /* SELECT/START */
    .start-select { bottom: 3vh; left: 50%; transform: translateX(-50%); display: flex; gap: 3vw; pointer-events: auto; }
    .start-select .btn { padding: 1vh 2vw; border: 2px solid rgba(255,255,255,0.7); border-radius: 20px; color: rgba(255,255,255,0.8); font-weight: bold; font-size: clamp(9px, 1.8vw, 14px); background: rgba(0,0,0,0.3); }

    /* زر Import */
    .import-btn { position: absolute; bottom: 12vh; right: 4vw; padding: 1.5vh 3vw; background: rgba(0, 200, 100, 0.8); color: #fff; border: none; border-radius: 30px; font-weight: bold; font-size: clamp(10px, 2vw, 16px); cursor: pointer; pointer-events: auto; z-index: 30; box-shadow: 0 0 15px rgba(0,200,100,0.5); }
    .import-btn:hover { background: rgba(0, 230, 120, 1); }

    /* قائمة الألعاب (تظهر عند اختيار Games) */
    .game-list { position: absolute; top: 20vh; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 10px; z-index: 25; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); }
    .game-list.active { display: flex; }
    .game-item { color: #fff; font-size: 16px; }
</style>
</head>
<body>
    <div class="bg"></div>
    <div class="wave"></div>

    <!-- شريط XMB -->
    <div class="xmb-bar" id="xmb">
        <!-- أيقونة إعدادات (ترس) -->
        <div class="cat" data-index="0" data-game="false">
            <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            Settings
        </div>
        <!-- أيقونة ألعاب (ذراع تحكم Atari) -->
        <div class="cat selected" data-index="1" data-game="true">
            <svg viewBox="0 0 24 24"><path d="M7 6h10c2.2 0 4 1.8 4 4v6c0 1.1-.9 2-2 2-.6 0-1.1-.2-1.5-.7L15 14H9l-2.5 3.3c-.4.5-.9.7-1.5.7-1.1 0-2-.9-2-2v-6c0-2.2 1.8-4 4-4zm0 4v2H5v-2h2zm10 0h-2v2h2v-2z"/></svg>
            Games
        </div>
        <!-- أيقونة وسائط (فيلم/موسيقى) -->
        <div class="cat" data-index="2" data-game="false">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
            Media
        </div>
    </div>

    <!-- قائمة الألعاب -->
    <div class="game-list" id="gameList">
        <div class="game-item">لا توجد ألعاب مضافة بعد</div>
    </div>

    <!-- زر الاستيراد -->
    <button class="import-btn" onclick="document.getElementById('fileInput').click()">Import Game</button>
    <input type="file" id="fileInput" accept=".a26,.bin,.rom" style="display:none" onchange="addGame(event)">

    <!-- أزرار التحكم -->
    <div class="controller-overlay">
        <div class="shoulder-btn left">L</div>
        <div class="shoulder-btn right">R</div>

        <!-- D-Pad -->
        <div class="btn-group dpad">
            <div class="dpad-btn dpad-up">▲</div>
            <div class="dpad-btn dpad-down">▼</div>
            <div class="dpad-btn dpad-left">◀</div>
            <div class="dpad-btn dpad-right">▶</div>
            <div class="dpad-btn dpad-center"></div>
        </div>

        <!-- أزرار PS3 -->
        <div class="btn-group ps3-actions">
            <div class="ps-btn btn-triangle">△</div>
            <div class="ps-btn btn-circle">○</div>
            <div class="ps-btn btn-cross">✕</div>
            <div class="ps-btn btn-square">□</div>
        </div>

        <div class="btn-group start-select">
            <div class="btn">SELECT</div>
            <div class="btn">START</div>
        </div>
    </div>

    <!-- الصوت -->
    <audio id="scrollSound" src="scroll.wav" preload="auto"></audio>
    <audio id="clickSound" src="click.wav" preload="auto"></audio>

<script>
    const cats = document.querySelectorAll('.cat');
    const scrollSound = document.getElementById('scrollSound');
    const clickSound = document.getElementById('clickSound');
    const gameList = document.getElementById('gameList');
    let selected = 1;

    function update() {
        cats.forEach((c, i) => {
            c.classList.toggle('selected', i === selected);
        });
        // إظهار قائمة الألعاب إذا كانت الفئة الحالية هي Games
        const isGame = cats[selected].dataset.game === 'true';
        gameList.classList.toggle('active', isGame);
    }

    function playScroll() {
        scrollSound.currentTime = 0;
        scrollSound.play().catch(e => {});
    }

    // التنقل بين الفئات
    cats.forEach((cat, i) => {
        cat.addEventListener('click', () => {
            if (selected !== i) {
                selected = i;
                update();
                playScroll();
            }
        });
    });

    // دعم لوحة المفاتيح
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { selected = Math.max(0, selected - 1); update(); playScroll(); }
        if (e.key === 'ArrowRight') { selected = Math.min(cats.length - 1, selected + 1); update(); playScroll(); }
    });

    // إضافة لعبة
    function addGame(event) {
        const file = event.target.files[0];
        if (!file) return;
        const gameName = file.name.replace(/\.[^/.]+$/, ""); // إزالة الامتداد
        if (gameList.querySelector('.game-item')?.textContent === "لا توجد ألعاب مضافة بعد") {
            gameList.innerHTML = ''; // مسح الرسالة
        }
        const item = document.createElement('div');
        item.className = 'game-item';
        item.textContent = gameName;
        gameList.appendChild(item);
        clickSound.play().catch(e => {});
    }

    update();
</script>
</body>
</html>
