name: Build AM2R APK

on:
  workflow_dispatch:
    inputs:
      am2r_url:
        description: 'رابط تحميل AM2R_11.zip'
        required: true
        default: 'https://archive.org/download/am2r1.1/am2r-another-metroid-2-remake-1-1.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          echo "deb http://security.ubuntu.com/ubuntu focal-security main universe" | sudo tee /etc/apt/sources.list.d/focal-security.list
          sudo apt-get update
          sudo apt-get install -y unzip sed xdelta3 patchelf openjdk-8-jre \
            libc6:i386 libncurses5:i386 libstdc++6:i386 libopenal1:i386

      - name: Download AM2R-Autopatcher
        run: |
          git clone https://github.com/AM2R-Community-Developers/AM2R-Autopatcher-Linux.git
          cd AM2R-Autopatcher-Linux
          chmod +x patcher.sh

      - name: Create output directory
        run: |
          mkdir -p ./AM2R-Autopatcher-Linux/am2r_1.5.5

      - name: Download and Verify AM2R_11.zip
        run: |
          set -e
          URL="${{ github.event.inputs.am2r_url }}"
          TARGET="./AM2R-Autopatcher-Linux/AM2R_11.zip"
          curl -L --fail --retry 3 --retry-delay 5 -o "$TARGET" "$URL"
          ls -lh "$TARGET"
          if ! unzip -t "$TARGET" > /dev/null 2>&1; then
            echo "❌ ERROR: Downloaded file is not a valid zip archive."
            exit 1
          fi

      - name: Run patcher and build APK
        run: |
          cd AM2R-Autopatcher-Linux
          ./patcher.sh --os android

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AM2R-APK
          path: ./AM2R-Autopatcher-Linux/am2r_1.5.5/AndroidM2R_1.5.5-signed.apk
          if-no-files-found: error 
