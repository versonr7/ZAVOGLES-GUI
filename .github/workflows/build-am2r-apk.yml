name: Build AM2R APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          # إضافة مستودع Ubuntu Focal للحصول على libncurses5:i386
          echo "deb http://security.ubuntu.com/ubuntu focal-security main universe" | sudo tee /etc/apt/sources.list.d/focal-security.list
          sudo apt-get update
          sudo apt-get install -y unzip sed xdelta3 patchelf openjdk-8-jre \
            libc6:i386 libncurses5:i386 libstdc++6:i386 libopenal1:i386

      - name: Download AM2R-Autopatcher
        run: |
          git clone https://github.com/AM2R-Community-Developers/AM2R-Autopatcher-Linux.git
          cd AM2R-Autopatcher-Linux
          chmod +x patcher.sh

      - name: Place AM2R_11.zip
        run: |
          echo "${{ secrets.AM2R_11_ZIP_BASE64 }}" | base64 --decode > ./AM2R-Autopatcher-Linux/AM2R_11.zip

      - name: Run patcher and build APK
        run: |
          cd AM2R-Autopatcher-Linux
          chmod +x patcher.sh
          ./patcher.sh --os android --am2rzip "${{ github.workspace }}/AM2R-Autopatcher-Linux/AM2R_11.zip"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AM2R-APK
          path: ./AM2R-Autopatcher-Linux/AM2R_*.APK
